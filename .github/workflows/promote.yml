name: Promote and release

# One button for the whole promotion chain. The branch ruleset requires a pull
# request for every permanent branch, so this opens them, waits for their checks,
# and merges — it never pushes to a permanent branch directly.
#
# Manual trigger only. That is the human gate: nothing here runs on a schedule
# or on push.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag main and publish a GitHub release when the chain lands"
        type: boolean
        default: true
      notes_file:
        description: "Release notes path (blank = generate from commits)"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # scv-core stores SCV_WRAPPER_SYNC_TOKEN; the wrappers store
      # SCV_CORE_SYNC_TOKEN. One file works in all three by trying both.
      GH_TOKEN: ${{ secrets.SCV_WRAPPER_SYNC_TOKEN || secrets.SCV_CORE_SYNC_TOKEN || github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SCV_WRAPPER_SYNC_TOKEN || secrets.SCV_CORE_SYNC_TOKEN || github.token }}

      - name: Promote develop to stage, then stage to main
        run: |
          set -uo pipefail

          promote() {
            local head="$1" base="$2"
            if [ -z "$(git log --oneline "origin/${base}..origin/${head}")" ]; then
              echo "::notice::${head} has nothing ${base} is missing — skipping."
              return 0
            fi

            local url
            if ! url=$(gh pr create --base "$base" --head "$head" \
                --title "chore: promote ${head} → ${base}" \
                --body "Opened by the promote workflow. ${head} is ahead of ${base}."); then
              url=$(gh pr list --base "$base" --head "$head" --state open --json url --jq '.[0].url // ""')
              [ -n "$url" ] || { echo "::error::Could not open or find a ${head} → ${base} PR."; return 1; }
              echo "Reusing the open PR: $url"
            fi
            local number="${url##*/}"

            # >>> await-mergeable — replayed verbatim by tests/test-promote-wait.sh.
            # Keep both markers. The test slices between them and runs the real
            # block against recorded fixtures; without them it fails loudly
            # rather than silently testing nothing.
            #
            # Wait for GitHub's own mergeability verdict, not for a check count.
            #
            # This block has now been wrong in both directions, so the reasoning
            # is worth keeping. First it asked whether checks had passed — but
            # `gh pr checks` exits non-zero while any check is pending, so that
            # read "not yet" for the whole wait. Then it asked how many checks
            # EXIST, which raced the moment of creation from the other side: a
            # matrix job that
            # a path filter skips is reported under its UNEXPANDED name — the
            # literal "Contract (<matrix.os placeholder>)", conclusion SKIPPED —
            # and it lands before the real jobs exist. So the count was 1
            # immediately, the loop broke, `gh pr checks --watch` saw one
            # COMPLETED entry and returned success, and the merge was then
            # rejected because the required checks had not started. That cost two
            # hand-merges in the 0.26.0 release.
            #
            # The fix is not "wait for more checks" — that same placeholder would
            # then hold the state at UNSTABLE forever and nothing would ever
            # merge. Three independent facts have to line up: nothing failed,
            # nothing is still running, and GitHub itself no longer calls the PR
            # BLOCKED. Only the last one knows what the required set is.
            echo "Waiting for #${number} to become mergeable..."
            local waited=0 state=UNKNOWN failed=0 pending=0 ready=0 json=""
            while [ "$waited" -lt 900 ]; do
              json="$(gh pr view "$number" --json mergeStateStatus,statusCheckRollup 2>/dev/null || true)"
              if [ -n "$json" ]; then
                state="$(printf '%s' "$json" | jq -r '.mergeStateStatus // "UNKNOWN"')"
                # Two shapes share this list: a check run carries status+conclusion,
                # a commit status carries state only. Read both or half the CI is
                # invisible here.
                failed="$(printf '%s' "$json" | jq '[.statusCheckRollup[]?
                  | select(.conclusion=="FAILURE" or .conclusion=="TIMED_OUT"
                        or .conclusion=="CANCELLED" or .conclusion=="ACTION_REQUIRED"
                        or .state=="FAILURE" or .state=="ERROR")] | length')"
                pending="$(printf '%s' "$json" | jq '[.statusCheckRollup[]?
                  | select((.status? // "COMPLETED") != "COMPLETED" or .state=="PENDING"
                        or .state=="EXPECTED")] | length')"

                if [ "${failed:-0}" -gt 0 ]; then
                  echo "::error::Checks failed on #${number} (${head} → ${base}). The chain stops here; the PR stays open."
                  return 1
                fi
                case "$state" in
                  DIRTY)
                    echo "::error::#${number} (${head} → ${base}) conflicts with its base. Resolve it by hand; the chain stops here."
                    return 1 ;;
                  DRAFT)
                    echo "::error::#${number} is still a draft."
                    return 1 ;;
                  BEHIND)
                    # Strict required checks: the head has to carry the base's tip.
                    gh pr update-branch "$number" >/dev/null 2>&1 || true ;;
                esac
                if [ "${pending:-0}" -eq 0 ] && [ "$state" != "BLOCKED" ] && [ "$state" != "UNKNOWN" ]; then
                  ready=1
                  break
                fi
              fi
              sleep 10
              waited=$((waited + 10))
            done

            if [ "$ready" -ne 1 ]; then
              echo "::error::#${number} was still ${state} with ${pending} check(s) running after ${waited}s — not merging. Nothing is left half-promoted; the PR stays open."
              return 1
            fi
            # <<< await-mergeable
            gh pr merge "$number" --merge || {
              echo "::error::Could not merge #${number}."
              return 1
            }
            echo "Merged #${number} (${head} → ${base})."
            git fetch --quiet origin
          }

          git fetch --quiet origin
          promote develop stage || exit 1
          promote stage main || exit 1

      - name: Tag main and publish the release
        if: inputs.release
        env:
          # Through env, never spliced into the script body: `${{ }}` inside
          # `run:` is substituted before bash sees it, so a crafted input would
          # execute as shell.
          NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          set -uo pipefail
          git fetch --quiet origin
          git checkout --quiet origin/main

          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::${tag} already exists — nothing to publish."
            exit 0
          fi

          # An annotated tag is a git object with an author, and a fresh runner
          # has no identity configured. Set it locally rather than globally so
          # nothing outside this checkout is affected.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "${REPO#*/} ${tag}"
          git push origin "$tag"

          notes="${NOTES_FILE:-}"
          if [ -n "$notes" ] && [ -f "$notes" ]; then
            gh release create "$tag" --title "${REPO#*/} ${tag}" --notes-file "$notes"
          else
            gh release create "$tag" --title "${REPO#*/} ${tag}" --generate-notes
          fi
          echo "Published ${tag}."
