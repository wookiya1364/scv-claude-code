name: branch-flow

# PR 타겟이 보호 브랜치(main/stage/develop)일 때 소스 브랜치 규칙을 강제 (CLAUDE.md §10)
on:
  pull_request:
    branches: [main, stage, develop]

permissions:
  contents: read

concurrency:
  group: branch-flow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-branch-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce branch flow (CLAUDE.md §10)
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: sh scripts/check-branch-flow.sh
      - name: Provenance gate
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash vendor/scv-core/core/scripts/check-provenance.sh
      - name: Vendor gate
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash vendor/scv-core/core/scripts/check-vendor-provenance.sh
