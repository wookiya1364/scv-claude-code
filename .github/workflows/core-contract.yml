name: SCV Core contract

on:
  push:
    branches: [main, stage, develop]
    paths:
      - 'adapter/**'
      - 'vendor/scv-core/**'
      - 'scripts/**'
      - 'tests/**'
      - 'commands/**'
      - 'protocols/**'
  pull_request:
    branches: [main, stage, develop]
    paths:
      - 'adapter/**'
      - 'vendor/scv-core/**'
      - 'core.lock'
      - 'scripts/**'
      - 'template/**'
      - 'DeckUI/**'
      - 'assets/**'
      - 'protocols/**'
      - 'commands/**'
      - 'tests/**'
      - 'VERSION'
      - 'TEMPLATE_VERSION'
      - 'host-profile.env'
      - '.claude-plugin/**'
      - '.github/scripts/**'
      - '.github/workflows/**'

concurrency:
  group: core-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    name: Contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install modern Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          modern_bash="$(brew --prefix)/bin/bash"
          "$modern_bash" -c 'test "${BASH_VERSINFO[0]}" -ge 4'
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Verify pinned core and Claude adapter
        run: bash tests/test-core-contract.sh

      - name: Shell syntax
        run: |
          find scripts tests adapter -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: Cross-platform smoke
        run: |
          bash .github/scripts/test-ci-fast-lanes.sh
          bash tests/test-apply-model-policy.sh
          bash tests/test-help-workspace.sh
          bash tests/test-workspace.sh
          bash tests/test-guard.sh
          bash tests/test-autosync.sh
          bash tests/test-sync-dirty.sh
          bash tests/run-dry.sh

      - name: Detect updater changes
        if: runner.os == 'Linux' && github.base_ref == 'develop'
        id: updater
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          required=no
          while IFS= read -r changed_file; do
            case "$changed_file" in
              scripts/sync-core.sh|scripts/project-core.sh|scripts/verify-core.sh|scripts/deck-runtime.sh|tools/*|.github/scripts/test-sync-core-smoke.sh)
                required=yes
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "Fast updater smoke required: $required"

      - name: Fast atomic updater smoke
        if: >-
          runner.os == 'Linux' &&
          github.base_ref == 'develop' &&
          steps.updater.outputs.required == 'yes'
        run: bash .github/scripts/test-sync-core-smoke.sh
